<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>Calendar (reference styling)</title>
  <link rel="stylesheet" href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css"/>
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css"/>
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="calendar-container">
  <nav id="toolbar">
    <div class="nav-group">
      <button id="btn-prev" class="btn" title="Previous" onclick="calendarHandler.calendarPrevious()">&#8249;</button>
      <button id="btn-next" class="btn" title="Next" onclick="calendarHandler.calendarNext()">&#8250;</button>
      <button id="btn-today" class="btn" onclick="calendarHandler.calendarToday()">Today</button>
    </div>
    <div class="nav-group" id="view-buttons">
      <label class="btn"><input type="radio" name="calendar-view" value="day" onchange="calendarViewChanges(this)">Day</label>
      <label class="btn"><input type="radio" name="calendar-view" value="week" onchange="calendarViewChanges(this)">Week</label>
      <label class="btn"><input type="radio" name="calendar-view" value="month" onchange="calendarViewChanges(this)">Month</label>
    </div>
    <time id="calendar-title"></time>
    <button id="btn-settings" class="btn" title="Style settings" onclick="toggleSettings()">&#9881;</button>
  </nav>

  <div id="settings-panel" hidden>
    <p class="settings-help">
      Event style is read from the referenced category table. Leave a field blank to auto-detect by
      common column names; otherwise enter the exact column ID in that table.
    </p>
    <label>Fill color column <input type="text" id="opt-fill" placeholder="auto (fillColor, color, …)"></label>
    <label>Text color column <input type="text" id="opt-text" placeholder="auto (textColor, …)"></label>
    <label>Bold column <input type="text" id="opt-bold" placeholder="auto (fontBold, bold)"></label>
    <label>Italic column <input type="text" id="opt-italic" placeholder="auto (fontItalic, italic)"></label>
    <label>Underline column <input type="text" id="opt-underline" placeholder="auto (fontUnderline, underline)"></label>
    <label>Strikethrough column <input type="text" id="opt-strike" placeholder="auto (fontStrikethrough, strikethrough)"></label>
    <label>Emoji column <input type="text" id="opt-emoji" placeholder="auto (emoji, icon, symbol)"></label>
    <label>Background column <input type="text" id="opt-background" placeholder="auto (shade, gradient, …)"></label>
    <label>Image column <input type="text" id="opt-image" placeholder="auto (image, picture, photo)"></label>
    <div class="settings-actions">
      <button class="btn" onclick="saveSettings()">Save</button>
      <button class="btn" onclick="toggleSettings()">Close</button>
    </div>
  </div>

  <div id="calendar"></div>
</div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.js"></script>
<script>
  // Force the form popup's time picker to 24-hour. The calendar grabs the reference
  // immediately when loaded, so this must run before the calendar script.
  (function () {
    tui.TimePicker = class extends tui.TimePicker {
      constructor(container, options) {
        super(container, {...options, format: 'HH:mm'});
      }
    };
  })();
</script>
<script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.js"></script>
<script src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
<script src="widget.js"></script>
</body>
</html>
